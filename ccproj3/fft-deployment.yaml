apiVersion: apps/v1
kind: Deployment
metadata:
  name: fft-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fft-app
  template:
    metadata:
      labels:
        app: fft-app
    spec:
      containers:
      - name: fft
        image: pucitcloudnet/fft:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: fft-service
spec:
  type: NodePort
  selector:
    app: fft-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
